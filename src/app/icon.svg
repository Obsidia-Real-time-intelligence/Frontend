<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </radialGradient>
    <linearGradient id="facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2630"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
  </defs>

  <!-- background glow disc -->
  <circle cx="16" cy="16" r="15" fill="url(#glow)" opacity="0.55"/>

  <!-- shard outline -->
  <path
    d="M16 3 L25 12 L23 24 L9 24 L7 12 Z"
    fill="url(#facet)"
    stroke="#A855F7"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- inner facet edges -->
  <path
    d="M16 3 L16 24 M7 12 L25 12 M9 24 L25 12 M23 24 L7 12"
    stroke="#A855F7"
    stroke-width="0.4"
    opacity="0.4"
    fill="none"
  />

  <!-- bright core sparkle -->
  <circle cx="16" cy="16" r="2" fill="#F0ABFC"/>
  <circle cx="16" cy="16" r="1" fill="#FFFFFF"/>
</svg>
